# A change to a plugin's files must ship with a version bump in the same PR: `claude plugin update`
# compares versions only, so an unbumped change never reaches installed copies.
# Fix a failure with: ./bin/mkt bump <plugin> <patch|minor|major>
name: plugin versions

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge base + tags
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: every changed plugin is bumped
        run: node tools/mkt.mjs check-bump --base "origin/${{ github.base_ref }}"
      - name: manifests agree (plugin.json, marketplace.json, pyproject)
        run: node tools/mkt.mjs validate
