# After a merge to main, tag every version that has no tag yet: <plugin>-v<version> and
# marketplace-v<version>. The PR already set the versions (mkt version, checked by plugin-versions),
# so nothing is committed here and the default token is enough: tags are not branch-protected.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # existing tags
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: tag new versions
        run: node tools/mkt.mjs tag --push
